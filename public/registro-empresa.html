<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talento Público</title>
    <link rel="icon" href="./img/imgIconoTalentoPublico.png">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/stylesRegistroEmpresa.css">
</head>

<body>
    <main>
        <div id="divContainerAll">
            <div id="divContainerRegistro">
                <h1 id="h1TitleRegistro">Registro</h1>
                <div id="divContainerForm">
                    <form id="formRegistroEmpresa" action="">
                        <label for="">Nombre de la empresa*</label>
                        <input type="text" id="txtNombreEmpresa" class="txtBackfond" required>
                        <label for="">Correo electronico*</label>
                        <input type="email" id="txtCorreo" class="txtBackfond" required>
                        <label for="">Contraseña*</label>
                        <input type="password" id="txtContrasenna" class="txtBackfond" required>
                        <span class="spanAlternarContrasenna"></span>
                        <span class="espacioIcono"></span>
                        <label for="">Foto de perfil</label>
                        <div id="divFotoPerfil">
                            <button id="btnFotoUsuario" type="button">Subir foto</button>
                            <img id="fotoUsuario">
                        </div>
                    </form>
                    <div id="ContainerBoton">
                        <button type="submit" id="btnRegistrarse">Registrarse</button>
                    </div>
                </div>
                <div id="divContainerYaTienes">
                    <a href="./inicio-sesion.html">¿Ya tienes una cuenta?</a>
                </div>
            </div>
        </div>
    </main>
    <!--Axios-->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <!--Script Cloudinary-->
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
    <!--Sweet Alert-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
    <!-- Servicio imagen -->
    <script src="./js/services/servicesImagen.js"></script>
    <!-- Servicio registrar empresa -->
    <script src="./js/services/servicesRegistrarEmpresa.js"></script>
    <!-- Controlador registro -->
    <script src="./js/controllers/controllersRegistroEmpresa.js"></script>

</body>

</html>
