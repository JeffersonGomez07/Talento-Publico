<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talento Público</title>
  <link rel="icon" href="./img/imgIconoTalentoPublico.png">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/stylesHeaderReclutador.css">
  <link rel="stylesheet" href="./css/stylesCambiarContrasenna.css">
</head>

<body>
  <header>
    <a href="./homepage-reclutador.html">
        <img id="imgLogoBanner" src="./img/imgLogoTalentoPublico.png" alt="">
    </a>

    <h1 id="h1TitleReclutador">Reclutador</h1>
    <nav>
        <a href="./invitar-aplicar.html">
            <img src="./img/imgIconoInvitarYFiltrar.png" alt="Invitar y filtrar">
            <span class="spanText">Invitar y filtrar</span>
        </a>
        <a href="./ver-aplicaciones-reclutador.html">
            <img src="./img/imgIconoAplicaciones.png" alt="Aplicaciones">
            <span class="spanText">Aplicaciones</span>
        </a>
        <a href="./modificar-reclutador.html">
            <img src="./img/imgIconoModificarUsuario.png" alt="Modificar usuario">
            <span class="spanText">Modificar usuario</span>
        </a>
        <a href="" id="aCerrarSesion">
            <img src="./img/imgIconoCerrarSesion.png" alt="Cerrar sesión">
            <span class="spanText">Cerrar sesión</span>
        </a>
    </nav>
</header>
  <main>
    <form id="formCambiar">
      <h1 id="h1TitleCambiarContra">Cambiar contraseña</h1>
      <label for="email" id="labelCorreo">Contraseña anterior:</label><br>
      <input type="password" id="txtContrasennaAnterior" class="txtBackFond" name="email" required><br><br>
      <label for="email" id="labelCorreo">Contraseña nueva:</label><br>
      <input type="password" id="txtContrasennaNueva" class="txtBackFond" name="email" required><br><br>
      <div class="divContainerButton">
        <button onclick="window.location.href = 'modificar-reclutador.html';" type="button" id="btnVolver">Volver</button>
        <button type="submit" id="btnEnviar">Confirmar</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="./js/services/servicesCambiarContrasennaEmpleado.js"></script>

  <script src="./js/services/servicesInvitarEmpleado.js"></script>

  <script src="./js/controllers/controllersCambiarContraseñaEmpleado.js"></script>
  <script src="./js/controllers/controllersCerrarSesion.js"></script>

</body>

</html>
