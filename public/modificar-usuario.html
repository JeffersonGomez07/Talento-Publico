<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talento Público</title>
    <link rel="icon" href="./img/imgIconoTalentoPublico.png">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/stylesHeaderUsuario.css">
    <link rel="stylesheet" href="./css/stylesModificarUsuario.css">
</head>

<body>
    <header>
        <a href="./homepage-usuario.html">
            <img id="imgLogoBanner" src="./img/imgLogoTalentoPublico.png" alt="">
        </a>
        <nav>
            <a href="./puestos.html">
                <img id="imgLogoPuesto" src="./img/imgIconoMaletin.png" alt="Puestos">
                <span class="spanText">Puestos</span>
            </a>
            <a href="./revisar-aplicaciones.html">
                <img src="./img/imgIconoCarpeta.png" alt="Aplicaciones">
                <span class="spanText">Aplicaciones</span>
            </a>
            <a href="./notificaciones.html">
                <img src="./img/imgIconoNotificaciones.png" alt="Notificaciones">
                <span class="spanText">Notificaciones</span>
            </a>
            <a href="./panel-usuario.html">
                <img src="./img/imgIconoUsuarioFinal.png" alt="Usuario">
                <span class="spanText">Usuario</span>
            </a>
            <a href="" id="aCerrarSesion">
                <img src="./img/imgIconoCerrarSesion.png">
                <span class="spanText">Cerrar sesión</span>
            </a>
        </nav>
    </header>
    <main>
        <div id="divContainerRegistro">
            <h1 id="h1TitleCrearRegistro">Registro</h1>
            <form action="" id="formDatosPuesto">
                <div class="divFila">
                    <div class="divFilaColumnIz">
                        <div id="divContainerNombreAll">
                            <div id="divContainerNombre">
                                <label for="nombre">Nombre*</label>
                                <input type="text" id="txtNombre" class="txtBackfond" name="nombre" required>
                            </div>
                        </div>
                        <div id="divContainerApellidosAll">
                            <div id="divContainerApellido1">
                                <label for="apellido1">Apellido 1*</label>
                                <input type="text" id="txtApellido1" class="txtBackfond" name="apellido1" required>
                            </div>
                        </div>
                    </div>
                    <div class="divFilaColumnDe">
                        <label>Género*</label>
                        <div class="divContainerRadioButtons">
                            <label><input id="radioButtons" type="radio" name="genero" value="Masculino"
                                    required>Masculino</label>
                            <label><input id="radioButtons" type="radio" name="genero" value="Femenino"
                                    required>Femenino</label>
                            <label><input id="radioButtons" type="radio" name="genero" value="Otro"
                                    required>Otro</label>
                        </div>
                        <div id="divContainerApellidosAll">
                            <div id="divContainerApellido2">
                                <label for="apellido2">Apellido 2*</label>
                                <input type="text" id="txtApellido2" class="txtBackfond" name="apellido2" required>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="divFila">
                    <div class="divFilaColumnIz">
                        <label for="email">Correo Electrónico*</label>
                        <input type="email" id="txtEmail" class="txtBackfond" name="email" required>
                    </div>

                    <div class="divFilaColumnDe">
                        <label for="foto">Foto de Perfil</label>
                        <div id="divFotoPerfil">
                            <button id="btnFotoUsuario" type="button">Subir foto</button>
                            <img id="fotoUsuario">
                        </div>
                    </div>
                </div>

                <div class="divFila">
                    <div class="divFilaColumnIz">
                        <label for="estudios" class="labelHead">Estudios 1*</label>
                        <div id="divContainerEstudios">
                            <div class="divEstudio">
                                <input type="text" id="txtEstudiosNombre1" class="txtBackFondEstudiosNombre"
                                    placeholder="Nombre del estudio" name="nombreestudio1" required>
                                <input type="text" id="txtEstudiosUniversidad1" class="txtBackFondEstudiosUniversidad"
                                    placeholder="Nombre universidad" name="nombreuniversidad1" required>
                                <div class="divContainerAnno">
                                    <input type="text" id="txtEstudiosInicio1" class="txtBackFondEstudios"
                                        placeholder="Año de inicio" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="estudiosinicio1" required>
                                    <input type="text" id="txtEstudiosFinal1" class="txtBackFondEstudios"
                                        placeholder="Año de finalización" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="estudiosfinal1" required>
                                </div>
                            </div>
                        </div>
                        <label for="estudios" class="labelHead2">Estudios 2</label>
                        <div id="divContainerEstudios">
                            <div class="divEstudio">
                                <input type="text" id="txtEstudiosNombre2" class="txtBackFondEstudiosNombre"
                                    placeholder="Nombre del estudio" name="nombreestudio2">
                                <input type="text" id="txtEstudiosUniversidad2" class="txtBackFondEstudiosUniversidad"
                                    placeholder="Nombre universidad" name="nombreuniversidad2">
                                <div class="divContainerAnno">
                                    <input type="text" id="txtEstudiosInicio2" class="txtBackFondEstudios"
                                        placeholder="Año de inicio" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="estudiosinicio2">
                                    <input type="text" id="txtEstudiosFinal2" class="txtBackFondEstudios"
                                        placeholder="Año de finalización" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="estudiosfinal2">
                                </div>
                            </div>
                        </div>
                        <label for="estudios" class="labelHead3">Estudios 3</label>
                        <div id="divContainerEstudios">
                            <div class="divEstudio">
                                <input type="text" id="txtEstudiosNombre3" class="txtBackFondEstudiosNombre"
                                    placeholder="Nombre del estudio" name="nombreestudio3">
                                <input type="text" id="txtEstudiosUniversidad3" class="txtBackFondEstudiosUniversidad"
                                    placeholder="Nombre universidad" name="nombreuniversidad3">
                                <div class="divContainerAnno">
                                    <input type="text" id="txtEstudiosInicio3" class="txtBackFondEstudios"
                                        placeholder="Año de inicio" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="estudiosinicio3">
                                    <input type="text" id="txtEstudiosFinal3" class="txtBackFondEstudios"
                                        placeholder="Año de finalización" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="estudiosfinal3">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="divFilaColumnDe">
                        <label for="experiencia" class="labelHead">Experiencia Laboral 1*</label>
                        <div id="divContainerExperiencias">
                            <div class="divExperiencia">
                                <input type="text" id="txtExperienciaEmpresa1" class="txtBackFondExperiencia"
                                    placeholder="Empresa" name="experienciaempresa1" required>
                                <input type="text" id="txtExperienciaPuesto1" class="txtBackFondExperiencia"
                                    placeholder="Puesto" name="experienciapuesto1" required>
                                <div class="divContainerAnno">
                                    <input type="text" placeholder="Año de inicio" id="txtExperienciaInicio1"
                                        class="txtBackFondExperiencia" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="annoInicioEmp1" required>
                                    <input type="text" id="txtExperienciaFinal1" class="txtBackFondExperiencia"
                                        placeholder="Año de finalización" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="annofinalizacionEmp1" required>
                                </div>
                            </div>
                        </div>
                        <label for="experiencia" class="labelHead2">Experiencia Laboral 2</label>
                        <div id="divContainerExperiencias">
                            <div class="divExperiencia">
                                <input type="text" id="txtExperienciaEmpresa2" class="txtBackFondExperiencia"
                                    placeholder="Empresa" name="experienciaempresa2">
                                <input type="text" id="txtExperienciaPuesto2" class="txtBackFondExperiencia"
                                    placeholder="Puesto" name="experienciapuesto2">
                                <div class="divContainerAnno">
                                    <input type="text" placeholder="Año de inicio" id="txtExperienciaInicio2"
                                        class="txtBackFondExperiencia" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="annoInicioEmp2">
                                    <input type="text" id="txtExperienciaFinal2" class="txtBackFondExperiencia"
                                        placeholder="Año de finalización" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="annofinalizacionEmp2">
                                </div>
                            </div>
                        </div>
                        <label for="experiencia" class="labelHead3">Experiencia Laboral 3</label>
                        <div id="divContainerExperiencias">
                            <div class="divExperiencia">
                                <input type="text" id="txtExperienciaEmpresa3" class="txtBackFondExperiencia"
                                    placeholder="Empresa" name="experienciaempresa3">
                                <input type="text" id="txtExperienciaPuesto3" class="txtBackFondExperiencia"
                                    placeholder="Puesto" name="experienciapuesto3">
                                <div class="divContainerAnno">
                                    <input type="text" placeholder="Año de inicio" id="txtExperienciaInicio3"
                                        class="txtBackFondExperiencia" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="annoInicioEmp3">
                                    <input type="text" id="txtExperienciaFinal3" class="txtBackFondExperiencia"
                                        placeholder="Año de finalización" onfocus="(this.type='date')"
                                        onblur="(this.type='text')" name="annofinalizacionEmp3">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div id="divContainerButton">
            <button Id="btnCancel" type="button">Volver</button>
            <button Id="btnSubmit" type="button">Actualizar</button>
        </div>
    </main>
    <!--Axios-->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
    <script src="./js/services/servicesImagen.js"></script>
    <script src="./js/services/servicesRegistrarUsuario.js"></script>
    <script src="./js/controllers/controllersModificarDatosUsuario.js"></script>
    <script src="./js/controllers/controllersCerrarSesion.js"></script>

</body>

</html>
