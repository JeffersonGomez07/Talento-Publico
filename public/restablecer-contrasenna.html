<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talento Público</title>
  <link rel="icon" href="./img/imgIconoTalentoPublico.png">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/stylesRestablecerContrasenna.css">
</head>

<body>
  <main>
    <form id="formCambiar">
      <h1 id="h1TitleCambiarContra">Cambiar contraseña</h1>
      <label for="email" id="labelContrasenna">Contraseña nueva:</label><br>
      <input type="password" id="txtContrasennaNueva" class="txtBackFond" name="email" required><br><br>
      <label for="email" id="labelConfirmarContrasenna">Confirmar contraseña nueva:</label><br>
      <input type="password" id="txtConfirmarContrasennaNueva" class="txtBackFond" name="email" required><br><br>
      <div class="divContainerButton">
        <button onclick="window.location.href = 'inicio-sesion.html';" type="button" id="btnVolver">Volver</button>
        <button type="submit" id="btnEnviar">Confirmar</button>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./js/services/servicesRestablecerContrasenna.js"></script>
  <script src="./js/controllers/controllersRestablercerContrasenna.js"></script>

</body>

</html>
